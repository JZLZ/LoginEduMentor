name: Frontend CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - dev
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, build and component tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      NEXT_PUBLIC_API_URL: http://localhost:21165/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Run lint
        run: yarn lint

      - name: Build application
        run: yarn run build

      - name: Run component tests
        run: yarn test
